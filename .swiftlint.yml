# SwiftLint configuration for AppLock
# https://github.com/realm/SwiftLint

included:
  - Sources
  - Tests

excluded:
  - .build
  - dist

opt_in_rules:
  - empty_count
  - closure_spacing
  - explicit_init
  - first_where
  - force_unwrapping
  - implicitly_unwrapped_optional
  - redundant_nil_coalescing
  - sorted_imports
  - vertical_whitespace_closing_braces
  - unused_import

disabled_rules:
  - todo # tracked via issues instead

line_length:
  warning: 120
  error: 160
  ignores_comments: true
  ignores_urls: true

type_body_length:
  warning: 350
  error: 500

file_length:
  warning: 500
  error: 800

identifier_name:
  min_length: 2
  excluded: [id, x, y, e, m]

force_cast: error
force_try: error

# SwiftLint configuration for FreshLock
# https://github.com/realm/SwiftLint

included:
  - Sources
  - Tests

excluded:
  - .build
  - dist

opt_in_rules:
  - empty_count
  - closure_spacing
  - explicit_init
  - first_where
  - force_unwrapping
  - implicitly_unwrapped_optional
  - redundant_nil_coalescing
  - vertical_whitespace_closing_braces

analyzer_rules:
  - unused_import

disabled_rules:
  - todo # tracked via issues instead
  # Conflicts with SwiftFormat wrapMultilineStatementBraces
  - opening_brace

line_length:
  warning: 120
  error: 160
  ignores_comments: true
  ignores_urls: true

type_body_length:
  warning: 350
  error: 500

file_length:
  warning: 600
  error: 800

function_body_length:
  warning: 60
  error: 100

identifier_name:
  min_length: 2
  excluded: [id, x, y, e, m, i, c]

force_cast: error
force_try: error

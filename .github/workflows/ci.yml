name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build & Test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        run: |
          for candidate in \
            /Applications/Xcode_16.4.app \
            /Applications/Xcode_16.3.app \
            /Applications/Xcode_16.2.app \
            /Applications/Xcode.app
          do
            if [[ -d "$candidate" ]]; then
              sudo xcode-select -s "$candidate"
              break
            fi
          done
          xcode-select -p
          xcodebuild -version || true

      - name: Swift version
        run: swift --version

      - name: Build
        run: swift build

      - name: Test
        run: swift test --parallel

  lint:
    name: SwiftLint & SwiftFormat
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - name: Install tools
        run: brew install swiftlint swiftformat

      - name: SwiftLint
        run: swiftlint --strict

      - name: SwiftFormat (lint only)
        run: swiftformat --lint .

  package:
    name: Package .app
    runs-on: macos-15
    needs: [build-test]
    steps:
      - uses: actions/checkout@v7

      - name: Build app bundle
        run: CONFIGURATION=release ARCH=universal Scripts/build-app.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FreshLock-app
          path: dist/FreshLock.app
